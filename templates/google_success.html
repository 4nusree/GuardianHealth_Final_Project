<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signing in — GuardianHealth</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            background: #070d1a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: #e2e8f0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #1a2640;
            border-top-color: #14b8a6;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        p {
            color: #64748b;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div>
        <div class="spinner"></div>
        <p>Signing you in…</p>
    </div>
    <script src="/static/js/auth.js"></script>
    <script>
        (function () {
            var user = {{ user| safe
        }};
        var token = {{ token| tojson }};
        var csrfToken = {{ csrf_token| tojson }};
        Auth.setSession(user, token, csrfToken);
        var map = { admin: '/admin', doctor: '/doctor', patient: '/patient', staff: '/staff' };
        window.location.replace(map[user.role] || '/patient');
    }) ();
    </script>
</body>

</html>
